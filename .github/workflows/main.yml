name: Update Cloudflare DNS

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cloudflare-dns
  cancel-in-progress: false

jobs:
  update-dns:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Collect IPs
        run: python collect_ips.py

      - name: Update Cloudflare DNS
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_NAME: 855660.xyz
          CF_RECORD_NAME: best.855660.xyz
          CF_IP_SOURCE: ip.txt
        run: python bestdomain.py

      - name: Commit IP list
        run: |
          if git diff --quiet -- ip.txt; then
            echo "ip.txt unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ip.txt
          git commit -m "chore: 更新优选 IP 列表"
          git push
